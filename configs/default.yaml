serial:
  port: /dev/orca0
  baudrate: 1000000
  interframe_us: 80

loop:
  control_hz: 250

motion:
  home_offset_um: 8000
  motion_home_id: 0
  motion_extend_id: 1           # EXTEND motion (holds — Python triggers return on input release)
  motion_return_id: 2           # RETURN motion (triggered by Python on input release)
  kin_type_min_jerk: 1
  motion_home_time_ms: 500
  motion_extend_time_ms: 150
  motion_return_time_ms: 150
  extended_position_um: 170000  # absolute target from home (µm)

timeouts:
  autozero_timeout_s: 60.0
  home_timeout_s: 10.0
  kick_timeout_s: 15.0          # extend + return + safety margin

tolerances:
  home_tol_um: 800

startup:
  boot_autozero_delay_s: 20      # wait this long after boot before auto-AutoZero

logging:
  log_dir: /data/logs            # production: writable /data partition
  csv_prefix: kick_cycle
  enabled: false                 # CSV cycle logging stays off in production
  file_enabled: true             # rotating app log
  file_name: orca_kicker.log
  file_level: INFO               # state transitions + errors
  max_bytes: 5000000             # 5 MB per file
  backup_count: 3                # keep 3 rotated files (~15 MB total)

gpio:
  enabled: true
  backend: lgpio
  pigpio_host: localhost        # unused — retained for config compat
  autozero:
    pin: 5
    pull_up: true
    bounce_time_s: 0.05
    lockout_ms: 300
  kick:
    pin: 6
    pull_up: true
    bounce_time_s: null
    lockout_ms: 150
  sleep_toggle:
    pin: 4                    # BCM pin — to be assigned
    pull_up: true
    bounce_time_s: 0.05
    lockout_ms: 300
  sleep_indicator:
    pin: 27                    # BCM output pin — to be assigned
    active_high: true

web_ui:
  host: "127.0.0.1"
  port: 5000
  status_json_path: "status.json"
  secrets_path: "configs/secrets.yaml"